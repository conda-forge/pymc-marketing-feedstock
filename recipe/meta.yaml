{% set python_min = "3.12" %}
{% set name = "pymc-marketing" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 63964aa76becba3ed41bfabdfa53450a99f0c852911980141d9d0566c0e5d422

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling <2
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >={{ python_min }}
    - arviz >=1.2.0,<2.0
    - arviz-plots >=1.2.0,<2.0
    - matplotlib-base >=3.5.1,<3.11
    - narwhals
    - numpy >=2.0,<3.0
    - pandas
    - patsy
    - pydantic >=2.1.0
    - pymc >=6.0.0,<6.1.0
    - pytensor >=3.0.0,<4.0
    - scikit-learn >=1.1.1
    - seaborn >=0.12.2
    - tqdm
    - xarray >=2024.1.0
    - xarray-einstats >=0.5.1
    - pyprojroot
    - pymc-extras >=0.11.0,<0.13.0
    - preliz >=0.20.0,<1.0
    - pyyaml

test:
  imports:
    - pymc_marketing
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Marketing Statistical Models in PyMC
  home: https://github.com/pymc-labs/pymc-marketing
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - maresb
    - twiecki
    - ricardoV94
    - drbenvincent
