{% set python_min = "3.12" %}
{% set name = "pymc-marketing" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: de9f0ea1486d9b0607b8e56a6e7ba11a9a2855f2e5d65e27e54c3ce2db1dede8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling <2
    - hatch-fancy-pypi-readme
    - pip
  run:
    - h5netcdf >=1.8.1
    - h5py >=3.16.0
    - python >={{ python_min }}
    - arviz >=1.2.0,<2.0
    - arviz-plots >=1.2.0,<2.0
    - arviz-stats >=1.2.0,<2.0
    - matplotlib-base >=3.5.1
    - narwhals
    - numpy >=2.0,<2.6
    - pandas >=2.2
    - patsy
    - pydantic >=2.1.0
    - pymc >=6.4.0,<6.5.0
    - scikit-learn >=1.1.1
    - seaborn >=0.12.2
    - tqdm
    - xarray >=2024.11.0
    - xarray-einstats >=0.5.1
    - pyprojroot
    - pymc-extras >=0.16.0,<0.17.0
    - preliz >=0.20.0,<1.0
    - pyyaml

test:
  imports:
    - pymc_marketing
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Marketing Statistical Models in PyMC
  home: https://github.com/pymc-labs/pymc-marketing
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - juanitorduz
    - maresb
    - twiecki
    - ricardoV94
    - drbenvincent
